# Database-backed tests — SP-004
#
# `tests/db` and `tests/lib/repositories/*.repo` assert what the DATABASE
# guarantees: constraints, triggers, the grading function, and every PostgREST
# query the repository layer builds. They need a live Supabase project, which is
# the one thing ci.yml deliberately does without — so they get their own job,
# exactly as the note in ci.yml said they would.
#
# It shares the E2E project and the E2E secrets. That is deliberate: it is the
# same "a database we are allowed to dirty" requirement, and a third Supabase
# project would be one more thing to seed and keep in step with a schema that
# has no migrations to apply (ARCHITECTURE §0).
#
# Secrets (Settings -> Secrets and variables -> Actions), from the TEST project
# and never the demo one:
#
#   E2E_SUPABASE_URL
#   E2E_SUPABASE_ANON_KEY
#   E2E_SUPABASE_SERVICE_ROLE_KEY
#
# The service_role key is what the sandbox writes fixtures with. RLS is on in
# the test project and the anon role matches no policy, so without it every
# insert is rejected with 42501 before a single assertion runs.
#
# SESSION_SECRET used to be here too, for tests/lib/auth/current-user.test.ts,
# which signed and read a real `skillpath_session` cookie. That cookie is gone —
# the session is Supabase's and lib/auth/session.ts is deleted — so the secret
# is no longer set anywhere. The E2E_SESSION_SECRET repository secret can be
# deleted; nothing reads it.
#
# The anon key IS needed, and is new here: tests/lib/auth/current-user.test.ts
# now signs in as its fixture members over the anon key, which is the only way
# to have an `auth.uid()` and therefore the only way to test RLS at all. The
# service-role key goes straight through the policies.
#
# Fork PRs get no secrets, so the job is skipped there rather than failing with
# a missing-key error that reads as a product bug.
#
# WHY IT DOES NOT NEED A SEED, WHERE THE E2E JOB DOES. Every test here creates
# the rows it needs through `Sandbox` (tests/helpers/supabase-test-client.ts)
# and deletes exactly those afterwards. Nothing truncates and nothing depends on
# the seeded bank, so this job cannot leave the project in a state the next run
# trips over — and it does not have to wait for `npm run seed:e2e`.

name: Database

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One database, and THIS JOB IS NOT ITS ONLY WRITER.
#
# The group used to be `db-tests`, which serialized this workflow against
# itself and against nothing else. e2e.yml runs on the same `pull_request`
# event, against the same Supabase project, and its journey registers a member
# — so the two overlapped on every PR, and stats.repo.test.ts, which reads a
# global count before and after creating one member, failed with
#
#     AssertionError: expected 48 to be 47
#
# intermittently and only in CI. The name is now the shared resource rather
# than the job, and e2e.yml names the same one, so the two queue behind each
# other. Renaming it back re-opens the race.
#
# `cancel-in-progress: false` because a cancelled run leaves its fixture rows
# behind: Sandbox.destroy() runs in afterAll and a killed process never reaches
# it.
concurrency:
  group: supabase-test-project
  cancel-in-progress: false

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Same-repo only: a fork cannot read the secrets below.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    env:
      # Read by tests/helpers/supabase-test-client.ts, which prefers the real
      # environment over .env.e2e — so no file is needed here. Its guard
      # compares this url against .env.local's, and there is no .env.local in
      # CI, so the guard passes on absence rather than being bypassed.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      AI_PROVIDER: mock

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install
        run: npm ci

      - name: Database tests
        run: npm run test:db
