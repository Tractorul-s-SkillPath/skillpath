# CI — SP-005
#
# This workflow runs. It used to be a fully commented-out design note with no
# `on:` and no `jobs:`, which meant GitHub Actions parsed it, found nothing to
# do, and did nothing — while the file's presence implied `main` was protected.
# It was not.
#
# Gate order is cheapest-first, so a type error does not wait on a build.
#
# Format and Lint are two gates, not one. Prettier decides where lines break;
# ESLint is the only step here that reads what the code does. Neither covers for
# the other, and `eslint-config-prettier` is what stops them arguing — see the
# order note in eslint.config.mjs. Next 16 removed `next lint`, so Lint runs
# eslint directly against a flat config (SP-122); the old `npm run lint`
# resolved to `next <dir>` and failed with "Invalid project directory".
#
# NOT here, and each one is a decision rather than an oversight:
#
#   tests/db and tests/lib/repositories — need a live Supabase test project,
#               so they run in .github/workflows/db.yml with the E2E secrets.
#               `npm run test:coverage` below uses vitest.config.ts, which
#               excludes them; `npm run test:db` uses vitest.config.db.ts,
#               which is the only thing that includes them.
#
#   Playwright (SP-101) — needs real credentials, a browser and four minutes,
#               none of which belong in the gate every push waits on. It builds
#               and starts the app itself against a separate Supabase project:
#               .github/workflows/e2e.yml.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      # The build imports lib/supabase/env.ts, which throws on a missing key.
      # Every page is server-rendered on demand (`ƒ` in the build output), so
      # nothing reaches Supabase during the build and placeholders are enough.
      # Real secrets would buy nothing and would expose them to fork PRs.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      # requireEnv('SUPABASE_SERVICE_ROLE_KEY') runs per request, not at module
      # load, so the build never reads this. It is here so a page that starts
      # rendering at build time fails on the placeholder rather than on a
      # missing name — and never with a real key in a fork PR.
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      # A broken or absent API key must never block a teammate (SP-090).
      AI_PROVIDER: mock

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install
        run: npm ci

      # First because it is the cheapest gate in the file — no compile, no
      # bundle, a couple of seconds. `--check` never writes; a failure prints
      # the offending paths and `npm run format` fixes all of them locally.
      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      # Errors fail this step; warnings do not, and there are seven of them on
      # purpose — see the react-hooks/set-state-in-effect note in
      # eslint.config.mjs. No --max-warnings, because pinning a count turns
      # every unrelated change into a merge conflict with this file.
      - name: Lint
        run: npm run lint

      - name: Test + coverage gate
        run: npm run test:coverage

      - name: Build
        run: npm run build
