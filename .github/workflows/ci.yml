# CI — SP-005
#
# This workflow runs. It used to be a fully commented-out design note with no
# `on:` and no `jobs:`, which meant GitHub Actions parsed it, found nothing to
# do, and did nothing — while the file's presence implied `main` was protected.
# It was not.
#
# Gate order is cheapest-first, so a type error does not wait on a build.
#
# NOT here, and each one is a decision rather than an oversight:
#
#   lint      — Next 16 removed `next lint`; the old `npm run lint` resolved to
#               `next <dir>` and failed with "Invalid project directory". ESLint
#               is not configured in this project, so there is nothing to run.
#               Adding eslint + eslint-config-next is its own story (SP-122):
#               it needs a config and a first pass over existing code, and
#               landing it inside this change would turn the first green
#               pipeline red for reasons unrelated to the pipeline.
#
#   tests/db and tests/lib/repositories — need a live Supabase test project,
#               so they run in .github/workflows/db.yml with the E2E secrets.
#               `npm run test:coverage` below uses vitest.config.ts, which
#               excludes them; `npm run test:db` uses vitest.config.db.ts,
#               which is the only thing that includes them.
#
#   Playwright (SP-101) — needs real credentials, a browser and four minutes,
#               none of which belong in the gate every push waits on. It builds
#               and starts the app itself against a separate Supabase project:
#               .github/workflows/e2e.yml.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      # The build imports lib/supabase/env.ts, which throws on a missing key.
      # Every page is server-rendered on demand (`ƒ` in the build output), so
      # nothing reaches Supabase during the build and placeholders are enough.
      # Real secrets would buy nothing and would expose them to fork PRs.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SESSION_SECRET: ci-placeholder-secret-at-least-32-characters-long
      # A broken or absent API key must never block a teammate (SP-090).
      AI_PROVIDER: mock

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test + coverage gate
        run: npm run test:coverage

      - name: Build
        run: npm run build
