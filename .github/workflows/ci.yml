# CI — SP-005
#
# ############################################################################
# THIS WORKFLOW DOES NOT RUN. The entire file is commented out: there is no
# `on:` trigger and no `jobs:` block, so GitHub Actions parses it, finds
# nothing to do, and does nothing. It is a design note that happens to live at
# a path where a working pipeline would go.
#
# It also refers to `npm run typecheck`, `npm run lint` and
# `npm run test:coverage`, none of which exist in package.json, and to a test
# suite that has not been written (docs/TESTING.md).
#
# Left in place deliberately as the plan for when tests land — not because it
# is protecting `main`. Nothing is protecting `main`.
# ############################################################################
#
# Sketch: one workflow, runs on every PR and on push to main.
#
#   jobs.verify:
#     - checkout, setup-node (lts, npm cache), npm ci
#     - npm run typecheck      # tsc --noEmit, strict
#     - npm run lint           # 'any' and unexplained suppressions fail here
#     - npm run test:coverage  # vitest --coverage, fails under the threshold
#     - npm run build          # next build
#     env: AI_PROVIDER=mock    # a broken API key never blocks a teammate (SP-090)
#
# Gate order matters: cheapest check first, so a type error does not wait on a build.
# main is protected — one approval, this workflow green. Nobody approves their own PR.
#
# Not here (yet): tests/db and tests/lib/repositories need a live Supabase test
# project; give them their own job with secrets once SP-004 lands.
# Playwright (SP-101) runs after the Vercel preview deployment is ready.
